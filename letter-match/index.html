<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letter Match CAPTCHA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root{
    --ink:#111; --paper:#fff; --muted:#6b6b6b; --rule:#e6e6e6;
    --ok:#1e8e3e; --bad:#d93025; --bg:#f3f3f1;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

  /* ---------- Demo sign-up form ---------- */
  .form{background:var(--paper);border-radius:14px;padding:28px;width:100%;max-width:380px;
    box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.06)}
  .form h1{font-size:22px;margin:0 0 4px}
  .form > p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .form label.f{display:block;font-size:13px;margin:12px 0 6px;color:#333}
  .form input.t{width:100%;padding:10px 12px;border:1px solid #d6d6d6;border-radius:8px;font:inherit;font-size:15px}
  .robot{margin-top:20px;display:flex;align-items:center;gap:14px;border:1px solid #d3d3d3;background:#f9f9f9;
    border-radius:6px;padding:14px 16px;cursor:pointer;user-select:none}
  .robot .box{width:28px;height:28px;border:2px solid #c1c1c1;border-radius:3px;background:#fff;
    display:grid;place-items:center;flex:none;transition:border-color .2s}
  .robot .box svg{opacity:0;transition:opacity .2s}
  .robot.done .box{border-color:transparent}
  .robot.done .box svg{opacity:1}
  .robot.loading .box{border-radius:50%;border-color:#c1c1c1 #c1c1c1 #c1c1c1 transparent;animation:spin .7s linear infinite}
  .robot .lbl{font-size:15px}
  .robot small{margin-left:auto;color:#999;font-size:10px;text-align:center;line-height:1.25}
  .submit{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--ink);color:#fff;font:inherit;font-size:15px;cursor:pointer}
  .submit:disabled{opacity:.35;cursor:not-allowed}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,15,15,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay[hidden]{display:none}
  .modal{position:relative;background:var(--paper);border-radius:16px;overflow:hidden;
    width:min(860px,100%,calc((100vh - 250px) * 1.5));min-width:min(320px,100%);
    box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal.shake{animation:shake .45s}
  .close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;line-height:1;color:#999;cursor:pointer;padding:6px;z-index:2}
  .head{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,32px);padding:clamp(16px,3vw,28px) 20px 0;flex-wrap:wrap}
  .match{font-size:clamp(30px,6vw,64px);letter-spacing:-.01em}
  #target{width:min(440px,62vw);height:auto;aspect-ratio:440/150;display:block}
  .stage{position:relative;aspect-ratio:900/600;width:100%}
  #world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .trash{position:absolute;left:3.3%;top:73%;width:11.1%;height:26%;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;pointer-events:none;gap:4px}
  .trash svg{width:72%;height:auto;transform-origin:85% 95%;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
  .trash.hot svg{transform:scale(1.12)}
  .trash.bump svg{transform:scale(.9)}
  .trash.pour svg{transform:rotate(75deg) translateY(-10%)}
  .trash .t{font-size:clamp(10px,1.7vw,17px)}
  .trash .count{position:absolute;top:2%;right:4%;min-width:1.6em;padding:0 .35em;height:1.6em;border-radius:99px;
    background:var(--ink);color:#fff;font-size:clamp(9px,1.3vw,12px);display:grid;place-items:center}
  .trash .count[hidden]{display:none}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--rule)}
  .btn{border:1px solid #d9d9d9;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f5f5f5}
  .btn.icon{padding:8px 10px}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#333}
  .btn svg{width:16px;height:16px}
  .btn.spin svg{animation:spin .6s linear}
  .msg{flex:1;min-width:120px;font-size:14px;color:var(--muted)}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  .hint{font-size:12px;color:#999;padding:0 18px 14px;margin-top:-6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
</style>
</head>
<body>

<form class="form" onsubmit="event.preventDefault();alert('Account created. Welcome, fellow human.')">
  <h1>Create account</h1>
  <p>Just one tiny verification step.</p>
  <label class="f" for="email">Email</label>
  <input class="t" id="email" type="email" placeholder="you@example.com">
  <div class="robot" id="robot" role="checkbox" aria-checked="false" tabindex="0">
    <div class="box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e8e3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <span class="lbl">I'm not a robot</span>
    <small>Letter<br>Match™</small>
  </div>
  <button class="submit" id="submit" disabled>Sign up</button>
</form>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-label="Letter match challenge">
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="head">
      <div class="match">Match</div>
      <canvas id="target"></canvas>
    </div>
    <div class="stage">
      <canvas id="world"></canvas>
      <div class="trash" id="trash">
        <span class="count" id="count" hidden>0</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6"/>
          <path d="M5.5 6l1 13.5A2 2 0 0 0 8.5 21.5h7a2 2 0 0 0 2-2L18.5 6"/><path d="M10 10.5v6.5"/><path d="M14 10.5v6.5"/>
        </svg>
        <span class="t">Trash</span>
      </div>
    </div>
    <div class="bar">
      <button class="btn" id="pour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-1.5 11a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7z"/><path d="M15 9c2.5 0 4.5 1.5 5 4"/><path d="M20 16v.01M18 19v.01"/></svg>
        Pour out
      </button>
      <button class="btn icon" id="rotL" title="Rotate last grabbed letter left (Q)" aria-label="Rotate left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="btn icon" id="rotR" title="Rotate last grabbed letter right (E)" aria-label="Rotate right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <span class="msg" id="msg"></span>
      <button class="btn icon" id="refresh" title="New combination" aria-label="New combination">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
      </button>
      <button class="btn primary" id="check">Check</button>
    </div>
    <div class="hint">Drag letters onto the line. Scroll (or Q / E) to rotate the letter you're holding.</div>
  </div>
</div>

<script>
const {Engine, Bodies, Body, Composite, Constraint, Query, Sleeping} = Matter;

// ---------- Config ----------
const W = 900, H = 600;                 // physics world size (logical px)
const CODE_LEN = 6;                     // TODO: +1 on each failure
const PILE_SIZE = 160;
const FAMILY = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const FONT = `48px ${FAMILY}`;
const LINE = {x1: 160, x2: 840, y: 150, thick: 9};
const TRASH = {x: 30, y: 440, w: 100, h: 155};
const DIVIDER_X = 150;
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const ANG_TOL = 20 * Math.PI / 180;
const SYM180 = new Set('HINOSXZosxzl08'); // look the same upside down
const FAIL_MSGS = ["That doesn't look right.", "Incorrect. Please try again.",
  "Hmm. Are you sure you're human?", "Close. Or not. We can't say.", "Please try harder."];

// ---------- Setup ----------
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
canvas.width = W * dpr; canvas.height = H * dpr;
const tcanvas = document.getElementById('target');
const tctx = tcanvas.getContext('2d');
const TW = 440, TH = 150;
tcanvas.width = TW * dpr; tcanvas.height = TH * dpr;

const $ = id => document.getElementById(id);
const overlay = $('overlay'), modal = $('modal'), msg = $('msg'), trashEl = $('trash'), countEl = $('count');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = s => s[Math.floor(Math.random() * s.length)];
const norm = a => Math.atan2(Math.sin(a), Math.cos(a));

const engine = Engine.create({enableSleeping: true, positionIterations: 8, velocityIterations: 6});
const world = engine.world;

let chars = [], trashBin = [], code = [], drag = null, lastHeld = null;
let isOpen = false, built = false, pouring = false, failIdx = 0;

// ---------- Glyph metrics ----------
const gcache = {};
function glyph(ch) {
  if (gcache[ch]) return gcache[ch];
  ctx.font = FONT;
  const m = ctx.measureText(ch);
  const l = m.actualBoundingBoxLeft, r = m.actualBoundingBoxRight;
  const a = m.actualBoundingBoxAscent, d = m.actualBoundingBoxDescent;
  return gcache[ch] = {w: l + r, h: a + d, ox: -(r - l) / 2, oy: (a - d) / 2};
}

function makeChar(ch, x, y, angle) {
  const g = glyph(ch);
  const b = Bodies.rectangle(x, y, Math.max(8, g.w * 0.72), Math.max(8, g.h * 0.96), {
    angle, friction: 0.7, frictionStatic: 1, restitution: 0.02, density: 0.002,
    chamfer: {radius: 2}, sleepThreshold: 45
  });
  b.ch = ch; b.g = g;
  Composite.add(world, b);
  chars.push(b);
  return b;
}

// ---------- Build a new round ----------
function makeCode() {
  const angles = [0, 0, Math.PI, Math.PI, Math.PI / 2, -Math.PI / 2];
  return Array.from({length: CODE_LEN}, () => ({ch: pick(CHARS), angle: pick(angles)}));
}

function swapCase(c) { return c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase(); }

function reset() {
  Composite.clear(world, false, true);
  chars = []; trashBin = []; drag = null; lastHeld = null;
  const wall = {isStatic: true, friction: 0.8};
  Composite.add(world, [
    Bodies.rectangle(W / 2, H + 30, W * 2, 60, wall),           // floor
    Bodies.rectangle(-30, 0, 60, H * 4, wall),                 // left
    Bodies.rectangle(W + 30, 0, 60, H * 4, wall),              // right
    Bodies.rectangle(DIVIDER_X, H - 75, 10, 150, wall),        // keeps pile out of the bin
  ]);

  code = makeCode();
  drawTarget();

  // Pile: the real characters, evil case-swapped decoys, and random filler
  const list = code.map(c => c.ch);
  code.forEach(c => { const s = swapCase(c.ch); if (s !== c.ch) list.push(s); });
  while (list.length < PILE_SIZE) list.push(pick(CHARS));
  list.sort(() => Math.random() - 0.5);

  const cols = 12;
  list.forEach((ch, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    makeChar(ch, 200 + col * 56 + rand(-8, 8), H - 40 - row * 60, rand(0, Math.PI * 2));
  });
  for (let i = 0; i < 520; i++) Engine.update(engine, 1000 / 60);   // let the pile settle

  Composite.add(world, [
    Bodies.rectangle((LINE.x1 + LINE.x2) / 2, LINE.y + LINE.thick / 2, LINE.x2 - LINE.x1, LINE.thick, wall), // the line
    Bodies.rectangle(W / 2, -30, W * 2, 60, wall),                                                       // ceiling
  ]);
  updateCount();
  setMsg('');
}

// ---------- Target image ----------
function drawTarget() {
  const c = tctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  const img = c.createImageData(tcanvas.width, tcanvas.height);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 214 + (Math.random() * 44 - 22) | 0;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ghost characters
  c.font = `78px ${FAMILY}`;
  c.fillStyle = 'rgba(0,0,0,.12)';
  for (let i = 0; i < 5; i++) {
    c.save(); c.translate(rand(10, TW - 10), rand(30, TH)); c.rotate(rand(-Math.PI, Math.PI));
    c.fillText(pick(CHARS), -20, 25); c.restore();
  }

  // the code
  c.font = FONT; c.fillStyle = '#111';
  const slots = code.map(t => {
    const g = glyph(t.ch);
    return Math.abs(Math.cos(t.angle)) * g.w + Math.abs(Math.sin(t.angle)) * g.h + 8;
  });
  let x = (TW - slots.reduce((a, b) => a + b, 0)) / 2;
  code.forEach((t, i) => {
    const g = glyph(t.ch);
    c.save();
    c.translate(x + slots[i] / 2, TH / 2 + rand(-7, 7));
    c.rotate(t.angle + rand(-0.08, 0.08));
    c.fillText(t.ch, g.ox, g.oy);
    c.restore();
    x += slots[i];
  });

  // scribbles
  c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 1.1;
  for (let i = 0; i < 6; i++) {
    c.beginPath();
    c.moveTo(rand(0, TW), rand(0, TH));
    c.bezierCurveTo(rand(0, TW), rand(0, TH), rand(0, TW), rand(0, TH), rand(0, TW), rand(0, TH));
    c.stroke();
  }
}

// ---------- Rendering / loop ----------
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(LINE.x1, LINE.y, LINE.x2 - LINE.x1, LINE.thick);
  ctx.font = FONT;
  const held = drag && drag.bodyB;
  for (const b of chars) if (b !== held) drawChar(b);
  if (held) drawChar(held);
}
function drawChar(b) {
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  ctx.fillText(b.ch, b.g.ox, b.g.oy);
  ctx.restore();
}

const inTrash = p => p.x > TRASH.x && p.x < TRASH.x + TRASH.w && p.y > TRASH.y && p.y < TRASH.y + TRASH.h;

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 100); last = now;
  if (isOpen && built) {
    while (acc >= 1000 / 60) {
      if (drag) Body.setAngularVelocity(drag.bodyB, drag.bodyB.angularVelocity * 0.8);
      Engine.update(engine, 1000 / 60);
      acc -= 1000 / 60;
    }
    for (const b of [...chars]) if (b !== (drag && drag.bodyB) && inTrash(b.position)) trashChar(b);
    trashEl.classList.toggle('hot', !!drag && inTrash(drag.bodyB.position));
    draw();
  } else acc = 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Input ----------
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
}
function topAt(p) {
  const hits = Query.point(chars, p);
  return hits.length ? hits[hits.length - 1] : null;
}
function wakeAll() { chars.forEach(b => Sleeping.set(b, false)); }

canvas.addEventListener('pointerdown', e => {
  const p = toWorld(e), b = topAt(p);
  if (!b) return;
  wakeAll();
  drag = Constraint.create({pointA: p, bodyB: b, pointB: {x: 0, y: 0}, stiffness: 0.18, damping: 0.1, length: 0});
  Composite.add(world, drag);
  // move to end so it draws on top
  chars.splice(chars.indexOf(b), 1); chars.push(b);
  lastHeld = b;
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  const p = toWorld(e);
  if (drag) drag.pointA = p;
  else canvas.style.cursor = topAt(p) ? 'grab' : 'default';
});
function release() {
  if (!drag) return;
  Composite.remove(world, drag);
  drag = null;
  canvas.style.cursor = 'default';
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

function rotateBody(b, d) {
  if (!b || !chars.includes(b)) return;
  Sleeping.set(b, false);
  Body.setAngle(b, b.angle + d);
  Body.setAngularVelocity(b, 0);
  lastHeld = b;
}
canvas.addEventListener('wheel', e => {
  const b = drag ? drag.bodyB : topAt(toWorld(e));
  if (!b) return;
  e.preventDefault();
  rotateBody(b, Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 80) * 0.004);
}, {passive: false});

const STEP = Math.PI / 12; // 15°
document.addEventListener('keydown', e => {
  if (!isOpen) return;
  const b = drag ? drag.bodyB : lastHeld;
  if (e.key === 'q' || e.key === 'Q' || e.key === 'ArrowLeft') rotateBody(b, -STEP);
  else if (e.key === 'e' || e.key === 'E' || e.key === 'ArrowRight') rotateBody(b, STEP);
  else if (e.key === 'Escape') closeModal();
});
$('rotL').onclick = () => rotateBody(lastHeld, -STEP);
$('rotR').onclick = () => rotateBody(lastHeld, STEP);

// ---------- Trash ----------
function trashChar(b) {
  Composite.remove(world, b);
  chars.splice(chars.indexOf(b), 1);
  if (lastHeld === b) lastHeld = null;
  trashBin.push(b.ch);
  wakeAll();
  updateCount();
  trashEl.classList.add('bump');
  setTimeout(() => trashEl.classList.remove('bump'), 160);
}
function updateCount() {
  countEl.textContent = trashBin.length;
  countEl.hidden = trashBin.length === 0;
}
$('pour').onclick = () => {
  if (pouring) return;
  if (!trashBin.length) { setMsg('The trash is empty.'); return; }
  pouring = true;
  trashEl.classList.add('pour');
  const items = trashBin.splice(0);
  updateCount();
  wakeAll();
  items.forEach((ch, i) => setTimeout(() => {
    const b = makeChar(ch, DIVIDER_X + 25, TRASH.y - 30, rand(0, Math.PI * 2));
    Body.setVelocity(b, {x: rand(4, 10), y: rand(-8, -3)});
    Body.setAngularVelocity(b, rand(-0.3, 0.3));
    if (i === items.length - 1) setTimeout(() => { trashEl.classList.remove('pour'); pouring = false; }, 250);
  }, 250 + i * 45));
};

// ---------- Check ----------
function onLine() {
  const held = drag && drag.bodyB;
  return chars.filter(b => b !== held &&
      b.position.x > LINE.x1 - 10 && b.position.x < LINE.x2 + 10 &&
      b.position.y < LINE.y && b.position.y > LINE.y - 110)
    .sort((a, b) => a.position.x - b.position.x);
}
function angleOk(b, t) {
  if (Math.abs(norm(b.angle - t.angle)) < ANG_TOL) return true;
  return SYM180.has(t.ch) && Math.abs(norm(b.angle - t.angle - Math.PI)) < ANG_TOL;
}
$('check').onclick = () => {
  const placed = onLine();
  const pass = placed.length === code.length &&
    placed.every((b, i) => b.ch === code[i].ch && angleOk(b, code[i]));
  if (pass) {
    setMsg('Verified. You are probably human.', 'ok');
    setTimeout(() => {
      closeModal();
      robot.classList.add('done'); robot.setAttribute('aria-checked', 'true');
      $('submit').disabled = false;
    }, 900);
  } else {
    setMsg(FAIL_MSGS[failIdx++ % FAIL_MSGS.length], 'bad');
    modal.classList.remove('shake'); void modal.offsetWidth; modal.classList.add('shake');
    // TODO: CODE_LEN + 1 on failure
  }
};
$('refresh').onclick = () => {
  const btn = $('refresh');
  btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
  setMsg('Shuffling…');
  setTimeout(reset, 30);
};

function setMsg(t, cls = '') { msg.textContent = t; msg.className = 'msg ' + cls; }

// ---------- Open / close ----------
const robot = $('robot');
function openChallenge() {
  if (robot.classList.contains('done') || robot.classList.contains('loading')) return;
  robot.classList.add('loading');
  setTimeout(() => {
    robot.classList.remove('loading');
    overlay.hidden = false;
    isOpen = true;
    if (!built) {
      setMsg('Loading characters…');
      setTimeout(() => { reset(); built = true; }, 30);
    }
  }, 700);
}
function closeModal() { release(); overlay.hidden = true; isOpen = false; }
robot.addEventListener('click', openChallenge);
robot.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); openChallenge(); } });
$('close').onclick = closeModal;
